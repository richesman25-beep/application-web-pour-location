apply plugin: 'com.android.application'

// The developer owns the upload key. Never commit credentials or use the debug key for Play.
def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('keystore.properties')
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
def signingValue = { name, environment -> releaseProperties.getProperty(name) ?: System.getenv(environment) }
def releaseStore = signingValue('storeFile', 'LOKASYON_UPLOAD_STORE_FILE')
def releaseStorePassword = signingValue('storePassword', 'LOKASYON_UPLOAD_STORE_PASSWORD')
def releaseAlias = signingValue('keyAlias', 'LOKASYON_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'LOKASYON_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = [releaseStore, releaseStorePassword, releaseAlias, releaseKeyPassword].every { it }


android {
    namespace "com.lokasyonlakay.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lokasyonlakay.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
        debug {
            if (System.getenv('LOKASYON_DEBUG_KEYSTORE')) {
                storeFile file(System.getenv('LOKASYON_DEBUG_KEYSTORE'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        validation {
            initWith release
            applicationIdSuffix '.validation'
            versionNameSuffix '-validation'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            resValue 'string', 'app_name', 'LOKASYON LAKAY · validation'
            resValue 'string', 'title_activity_main', 'LOKASYON LAKAY · validation'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Fail before compiling a release when the developer has not configured the upload key.
tasks.register('validatePlaySigning') {
    doLast {
        if (!hasReleaseSigning || !rootProject.file(releaseStore).isFile()) {
            throw new GradleException('Configure android/keystore.properties with your Google Play upload key. See GOOGLE_PLAY.md. For build checks only, use bundleValidation.')
        }
        def configFile = file('src/main/assets/public/play-config.json')
        if (!configFile.exists()) throw new GradleException('Run npm run build:android before generating the release.')
        def playConfig = new groovy.json.JsonSlurper().parse(configFile)
        [playConfig.privacyPolicyUrl, playConfig.accountDeletionUrl].each { link ->
            if (!(link instanceof String) || !link.startsWith('https://') || link.contains('.example')) {
                throw new GradleException('Set your real HTTPS privacy and account deletion pages in .env.android.local. See GOOGLE_PLAY.md.')
            }
        }
        if (releaseAlias == 'androiddebugkey') {
            throw new GradleException('A debug key cannot sign the Google Play release. Create your upload key in Android Studio.')
        }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn tasks.named('validatePlaySigning')
}
